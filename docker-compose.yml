services:
  financas-agent:
    build:
      context: .
      args:
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-false}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: financas-agent:local
    container_name: financas-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - traefik_proxy
      - deon_fin_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.financas.rule=Host(`fin.deonlab.tech`)"
      - "traefik.http.routers.financas.entrypoints=websecure"
      - "traefik.http.routers.financas.middlewares=tailscale-only@docker,financas-security@docker"
      - "traefik.http.middlewares.financas-security.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.financas-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.financas-security.headers.frameDeny=true"
      - "traefik.http.middlewares.financas-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.financas-security.headers.permissionsPolicy=geolocation=(), camera=(), microphone=(), payment=(), usb=()"
      - "traefik.http.middlewares.financas-security.headers.contentSecurityPolicy=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.pluggy.ai; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self' data:; connect-src 'self' https://*.pluggy.ai; frame-src https://*.pluggy.ai"
      - "traefik.http.routers.financas.tls=true"
      - "traefik.http.routers.financas.tls.certresolver=letsencrypt"
      - "traefik.http.routers.financas.tls.domains[0].main=fin.deonlab.tech"
      - "traefik.http.routers.financas.service=financas"
      - "traefik.http.services.financas.loadbalancer.server.port=8000"

  postgres:
    image: postgres:16-alpine
    container_name: financas-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deon_fin}
      POSTGRES_USER: ${POSTGRES_USER:-deon_fin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deon_fin_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  traefik_proxy:
    external: true
  deon_fin_internal:
    driver: bridge
